
version: 2

models:
  - name: dim_store
    description: One current descriptive row per store.

    columns:
      - name: store_no
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: One row per observed product attribute combination.

    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null

      - name: item_no
        data_tests:
          - not_null

      - name: vendor_number
        data_tests:
          - not_null

      - name: bottle_volume_ml
        data_tests:
          - not_null

  - name: dim_date
    description: One row per observed transaction date.

    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

      - name: date_day
        data_tests:
          - unique
          - not_null

      - name: day_of_week
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false

  - name: fact_sales
    description: One row per source sales line, preserving source multiplicity.

    columns:
      - name: invoice_id
        data_tests:
          - not_null

      - name: store_no
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_no

      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: sales_bottles
        data_tests:
          - not_null

      - name: sales_dollars
        data_tests:
          - not_null

      - name: sales_liters
        data_tests:
          - not_null
